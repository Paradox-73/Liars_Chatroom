<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="banner-title banner-desc">
<title id="banner-title">The Liar's Chatroom: rules first, a judge model for the rest</title>
<desc id="banner-desc">Synergy '26 Kaggle competition entry, IIIT Bangalore. Team Claude Laggye: Kanav Bhardwaj, Nirbhay Sharma, Bhavya Jain, Aaryan Antala. A rule solver answers 2,257 of 2,500 train cases at 100% precision; Qwen3-14B-AWQ judges the rest on two T4 cards. New-family accuracy 0.957 (287 of 300); 78.5 minutes against the 90-minute limit.</desc>
<defs>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/></pattern>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.16"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="0.5" stop-color="#ec4899"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
<clipPath id="frame"><rect width="1280" height="320" rx="16"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="1280" height="320" fill="#0d0b14"/>
<rect width="1280" height="320" fill="url(#dots)"/>
<ellipse cx="1030" cy="160" rx="300" ry="190" fill="url(#glow)"/>
<rect y="314" width="1280" height="6" fill="url(#rule)"/>
<rect x="0.5" y="0.5" width="1279" height="319" rx="16" fill="none" stroke="#1f2a37"/>
</g>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="64" y="62" fill="#a78bfa" font-size="14" font-weight="600" letter-spacing="2.2" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">SYNERGY '26 KAGGLE · IIIT BANGALORE</text>
<text x="62" y="126" fill="#f0f4f8" font-size="56" font-weight="700">The Liar's Chatroom</text>
<text x="62" y="178" fill="#f0f4f8" font-size="40" font-weight="700">Rules first, <tspan fill="#ec4899">Qwen3-14B</tspan> for the rest</text>
<text x="64" y="216" fill="#9aa7b4" font-size="18">Rules answer 2,257 of 2,500 train cases at 100% precision · judge on two T4 cards</text>
<text x="64" y="244" fill="#a78bfa" font-size="18" font-weight="600">New-family accuracy 0.957 (287 of 300)  ·  78.5 min of the 90-min limit</text>
<text x="64" y="284" fill="#6f7d8c" font-size="13" font-weight="600" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">TEAM</text>
<text x="112" y="285" fill="#f0f4f8" font-size="18" font-weight="600">Claude Laggye</text>
<text x="262" y="285" fill="#9aa7b4" font-size="15">Kanav Bhardwaj, Nirbhay Sharma, Bhavya Jain, Aaryan Antala</text><rect x="248" y="271" width="1" height="18" fill="#2c3946"/>
</g>
<g transform="translate(900,60)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"><rect x="0" y="10" width="110" height="52" rx="14" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-width="1.4"/><text x="55" y="43" fill="#f0f4f8" font-size="22" font-weight="700" text-anchor="middle">A</text><rect x="130" y="40" width="110" height="52" rx="14" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-width="1.4"/><text x="185" y="73" fill="#f0f4f8" font-size="22" font-weight="700" text-anchor="middle">B</text><rect x="0" y="110" width="110" height="52" rx="14" fill="#ef4444" fill-opacity="0.28" stroke="#ef4444" stroke-width="2.4"/><text x="55" y="143" fill="#f0f4f8" font-size="22" font-weight="700" text-anchor="middle">C</text><rect x="130" y="140" width="110" height="52" rx="14" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-width="1.4"/><text x="185" y="173" fill="#f0f4f8" font-size="22" font-weight="700" text-anchor="middle">D</text><text x="55" y="190" fill="#ef4444" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">the liar</text><text x="120" y="-14" fill="#9aa7b4" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">4 speakers, 1 liar</text></g>
</svg>
